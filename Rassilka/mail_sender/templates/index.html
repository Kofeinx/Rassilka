<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4c1d95">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MailSender">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <title>Mail Sender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <h1>📧 Mail Sender</h1>
        <div id="status-badge" class="badge hidden"></div>
    </header>

    <main>
        <section id="tab-accounts" class="tab active">
            <div class="card">
                <h2>Аккаунты</h2>
                <div id="accounts-count" class="muted"></div>
                <div id="accounts-list" class="list"></div>
            </div>

            <div class="card">
                <h2>Добавить аккаунт</h2>
                <label>Email</label>
                <input id="new-email" type="email" placeholder="user@gmail.com" autocomplete="off" autocapitalize="off">
                <label>App-пароль</label>
                <input id="new-password" type="password" placeholder="16 символов" autocomplete="off">
                <button id="btn-add" class="btn primary">➕ Добавить</button>
                <div class="muted small">Gmail: myaccount.google.com/apppasswords</div>
            </div>
        </section>

        <section id="tab-compose" class="tab">
            <div class="card">
                <h2>Письмо</h2>
                <label>Кому</label>
                <input id="msg-to" type="email" placeholder="recipient@example.com" autocapitalize="off">
                <label>Тема</label>
                <input id="msg-subject" type="text" placeholder="Тест от {email}">
                <label>Текст</label>
                <textarea id="msg-body" rows="6"></textarea>
            </div>

            <div class="card">
                <h2>Задержки</h2>
                <label>Между письмами (сек, мин-макс)</label>
                <div class="row">
                    <input id="delay-min" type="number" min="1" value="15">
                    <input id="delay-max" type="number" min="1" value="45">
                </div>
                <label>Батч: размер / пауза (сек)</label>
                <div class="row">
                    <input id="batch-size" type="number" min="1" value="10">
                    <input id="batch-pause" type="number" min="1" value="300">
                </div>
                <button id="btn-save-msg" class="btn primary">💾 Сохранить</button>
            </div>
        </section>

        <section id="tab-send" class="tab">
            <div class="card">
                <h2>Отправка</h2>
                <div id="send-summary" class="muted"></div>
                <button id="btn-send" class="btn primary big">🚀 Начать</button>
                <button id="btn-stop" class="btn danger big hidden">⛔ Остановить</button>
            </div>

            <div class="card" id="progress-card" style="display:none">
                <h2>Прогресс</h2>
                <div class="progress-bar"><div id="progress-fill"></div></div>
                <div id="progress-text" class="muted"></div>
                <div id="current-email" class="small"></div>
            </div>

            <div class="card" id="results-card" style="display:none">
                <h2>Результаты</h2>
                <div id="results-list" class="list"></div>
            </div>
        </section>
    </main>

    <nav class="bottomnav">
        <button data-tab="accounts" class="active">📋<span>Аккаунты</span></button>
        <button data-tab="compose">✏️<span>Письмо</span></button>
        <button data-tab="send">🚀<span>Отправка</span></button>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
